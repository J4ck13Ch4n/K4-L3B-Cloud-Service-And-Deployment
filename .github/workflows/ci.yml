name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-dummy
      REDIS_URL: fake://
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t day12-agent:ci .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Railway
        env:
          # Project token (Railway -> project Settings -> Tokens), stored as a GitHub secret
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ae77f0f6-99f5-48e5-b99a-aab5f6d1d0ac
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set - skipping deploy, smoke testing the current deployment only"
            exit 0
          fi
          npm install -g @railway/cli@5.63.1
          railway up --ci --service "$RAILWAY_SERVICE_ID"
      - name: Smoke test public URL
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://agent-production-9827.up.railway.app' }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          echo "Smoke testing $PUBLIC_URL"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$PUBLIC_URL/health"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$PUBLIC_URL/ready"
          # /ask without a key must be rejected
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$PUBLIC_URL/ask" \
            -H 'Content-Type: application/json' -d '{"question":"ci"}')
          [ "$code" = "401" ] || { echo "expected 401 without API key, got $code"; exit 1; }
          if [ -n "$DEPLOY_API_KEY" ]; then
            curl -fsS -X POST "$PUBLIC_URL/ask" -H 'Content-Type: application/json' \
              -H "X-API-Key: $DEPLOY_API_KEY" -H 'X-User-Id: ci-smoke' \
              -d '{"question":"ci smoke test"}'
          fi
